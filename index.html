<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro Forte: O Jogo do Campo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef5ed;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #2e7d32;
            margin-bottom: 10px;
        }

        .painel-financeiro {
            background-color: #fff;
            padding: 15px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            font-size: 24px;
            font-weight: bold;
            color: #1b5e20;
            margin-bottom: 20px;
        }

        .fazenda {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 15px;
            margin-bottom: 30px;
        }

        .lote {
            width: 100px;
            height: 100px;
            background-color: #8d6e63;
            border: 3px solid #5d4037;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            cursor: pointer;
            transition: transform 0.1s;
            user-select: none;
        }

        .lote:hover {
            transform: scale(1.05);
        }

        .lote.pronto {
            background-color: #cddc39;
            border-color: #afb42b;
        }

        .loja {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }

        .loja h2 {
            margin-top: 0;
            color: #3e2723;
            border-bottom: 2px solid #a1887f;
            padding-bottom: 5px;
        }

        .item-loja {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        button {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #1b5e20;
        }

        button:disabled {
            background-color: #9e9e9e;
            cursor: not-allowed;
        }
    </style>
</head>
