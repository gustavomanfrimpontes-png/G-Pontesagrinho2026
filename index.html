<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Agrinho: Agro Forte & Sustentável</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header>
            <h1>Agrinho: Missão Futuro Sustentável</h1>
            <p>Equilibre a força do agro com a saúde do planeta!</p>
        </header>

        <div class="status-container">
            <div class="status-card">
                <span>💰 Economia (Agro Forte):</span>
                <div class="bar-container">
                    <div id="bar-economy" class="bar economy" style="width: 50%;"></div>
                </div>
                <span id="txt-economy">50%</span>
            </div>
            
            <div class="status-card">
                <span>🌱 Sustentabilidade:</span>
                <div class="bar-container">
                    <div id="bar-environment" class="bar environment" style="width: 50%;"></div>
                </div>
                <span id="txt-environment">50%</span>
            </div>
        </div>

        <main class="game-screen">
            <div id="turn-indicator">Rodada: 1/5</div>
            <p id="event-description">Carregando desafio...</p>
            
            <div id="choices-container" class="choices-grid">
                </div>
        </main>

        <div id="modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="modal-title">Fim da Jornada!</h2>
                <p id="modal-text">Resultado</p>
                <button id="btn-restart" onclick="restartGame()">Jogar Novamente</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
